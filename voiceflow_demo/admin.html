<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Auto - Admin Panelė</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .leads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .lead-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lead-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .lead-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .lead-quality {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 100px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .quality-Karštas { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .quality-Vidutinis { background: rgba(245, 158, 11, 0.1); color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }
        .quality-Šaltas { background: rgba(59, 130, 246, 0.1); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }

        .lead-detail {
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .lead-detail strong {
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .lead-summary {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d1d5db;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="admin-header">
            <div>
                <h1>Pardavėjo Dashboard'as</h1>
                <p>Gauti klientų skambučiai ir „Leads“ (išsaugoma jūsų naršyklėje)</p>
            </div>
            <div>
                <button class="btn" id="exportBtn" style="margin-right: 12px; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #6ee7b7;">📥 Eksportuoti į Excel (CSV)</button>
                <a href="index.html" class="btn" style="margin-right: 12px;">Grįžti į skelbimus</a>
                <button class="btn btn-danger" id="clearBtn">Išvalyti visus duomenis</button>
            </div>
        </header>

        <main id="leadsContainer">
            <div id="statsBox" style="display: none; padding: 16px 20px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 1rem; color: #60a5fa;">Skambučių Statistika</h3>
                    <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">Apskaičiuota pagal išsaugotų skambučių trukmę (Taikomas 0.09 € / min tarifas)</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px;">Vidutinė skambučio kaina:</div>
                    <div id="avgCostDisplay" style="font-size: 1.5rem; font-weight: 700; color: #fff;">0.00 €</div>
                </div>
            </div>
            <!-- Leads will be injected here -->
        </main>
    </div>

    <script>
        function renderLeads() {
            const container = document.getElementById('leadsContainer');
            const leads = JSON.parse(localStorage.getItem('premium_auto_leads') || '[]');

            if (leads.length === 0) {
                document.getElementById('statsBox').style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 16px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <h2>Kol kas užklausų nėra</h2>
                        <p>Kai AI asistentas priims skambutį ir surinks kliento informaciją, ji atsiras čia.</p>
                    </div>
                `;
                return;
            }

            document.getElementById('statsBox').style.display = 'flex';
            
            // Calculate average cost
            let totalSeconds = 0;
            let validCalls = 0;
            leads.forEach(lead => {
                if (lead.call_duration) {
                    const match = lead.call_duration.match(/(\d+)min\s*(\d+)s/);
                    if (match) {
                        totalSeconds += parseInt(match[1]) * 60 + parseInt(match[2]);
                        validCalls++;
                    }
                }
            });
            const avgSeconds = validCalls > 0 ? totalSeconds / validCalls : 0;
            const avgCost = (avgSeconds / 60) * 0.09; // 0.09 EUR per minute rate
            document.getElementById('avgCostDisplay').innerText = \`~\${avgCost.toFixed(2)} €\`;

            // Sort by newest first
            leads.sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = '<div class="leads-grid">';
            
            leads.forEach((lead, index) => {
                const dateObj = new Date(lead.date);
                const dateString = dateObj.toLocaleDateString('lt-LT') + ' ' + dateObj.toLocaleTimeString('lt-LT', {hour: '2-digit', minute:'2-digit'});
                
                const qualityClass = lead.lead_quality ? `quality-${lead.lead_quality.replace(/[^a-zA-Zžūįšų]/g, '')}` : 'quality-Vidutinis';
                const qualityLabel = lead.lead_quality || "Nenustatyta";

                html += `
                    <div class="lead-card" style="${lead.source === 'auto' ? 'border-left: 3px solid rgba(245, 158, 11, 0.5);' : 'border-left: 3px solid rgba(16, 185, 129, 0.5);'}">
                        <div class="lead-header">
                            <div>
                                <div class="lead-name">${lead.customer_name || 'Nežinomas klientas'}</div>
                                <div class="lead-date">${dateString}${lead.call_duration ? ' • Trukmė: ' + lead.call_duration : ''}</div>
                            </div>
                            <div class="lead-quality ${qualityClass}">${qualityLabel}</div>
                        </div>
                        
                        <div class="lead-detail">
                            <strong>Telefonas</strong>
                            ${lead.phone_number || 'Nenurodytas'}
                        </div>
                        
                        <div class="lead-detail">
                            <strong>Domina</strong>
                            ${lead.car_interested_in || 'Nenurodyta'}${lead.car_price ? ' — ' + lead.car_price : ''}
                        </div>

                        <div class="lead-summary">
                            <strong>Pokalbio santrauka ir klausimai:</strong>
                            ${lead.summary || 'Komentarų nėra.'}
                        </div>
                        
                        ${lead.source === 'auto' ? '<div style="margin-top: 12px; font-size: 0.75rem; color: #f59e0b; opacity: 0.7;">⚠ Automatinis įrašas (agentas neiškvietė save_lead)</div>' : ''}
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('Ar tikrai norite ištrinti visus surinktus skambučių duomenis? Šio veiksmo atšaukti negalima.')) {
                localStorage.removeItem('premium_auto_leads');
                renderLeads();
            }
        });

        // Initial render
        renderLeads();

        document.getElementById('exportBtn').addEventListener('click', () => {
            const leads = JSON.parse(localStorage.getItem('premium_auto_leads') || '[]');
            if (leads.length === 0) {
                alert('Nėra jokių duomenų eksportavimui.');
                return;
            }

            // Prepare CSV header
            let csvContent = "Data,Vardas,Telefonas,Automobilis,Kaina,Trukmė,Kokybė,Šaltinis,Santrauka\n";

            // Prepare CSV rows
            leads.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(lead => {
                const date = new Date(lead.date).toLocaleString('lt-LT').replace(',', '');
                const row = [
                    `"${date}"`,
                    `"${lead.customer_name || ''}"`,
                    `"${lead.phone_number || ''}"`,
                    `"${lead.car_interested_in || ''}"`,
                    `"${lead.car_price || ''}"`,
                    `"${lead.call_duration || ''}"`,
                    `"${lead.lead_quality || ''}"`,
                    `"${lead.source === 'auto' ? 'Automatinis' : 'Agento'}"`,
                    `"${(lead.summary || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            // Trigger download
            const blob = new Blob(["\ufeff", csvContent], { type: 'text/csv;charset=utf-8;' }); // \ufeff for Excel UTF-8 BOM
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Premium_Auto_Leads_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Listen for changes from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'premium_auto_leads') {
                renderLeads();
            }
        });
    </script>
</body>
</html>
